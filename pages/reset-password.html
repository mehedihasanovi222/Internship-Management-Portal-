<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Internship Management Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50: '#eef2ff', 600: '#4f46e5', 700: '#4338ca' }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col justify-between">

  <!-- Header -->
  <header class="py-6 px-6 max-w-7xl mx-auto w-full flex items-center justify-between">
    <a href="../index.html" class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white font-bold shadow-md shadow-indigo-600/20">
        <i class="fa-solid fa-graduation-cap"></i>
      </div>
      <span class="text-xl font-bold font-heading text-slate-900 dark:text-white">INTERN<span class="text-indigo-600">PORTAL</span></span>
    </a>
    <div class="flex items-center gap-3">
      <button class="theme-toggle-btn p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition">
        <i class="fa-regular fa-moon dark:hidden"></i>
        <i class="fa-regular fa-sun hidden dark:block text-amber-400"></i>
      </button>
      <a href="student/login.html" class="text-xs font-semibold text-indigo-600 dark:text-indigo-400 hover:underline">
        &larr; Back to Login
      </a>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-1 flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-3xl p-8 shadow-xl relative overflow-hidden">
      
      <!-- Top Decorative Accent -->
      <div class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-emerald-500 via-teal-500 to-indigo-500"></div>

      <div class="text-center mb-6">
        <div class="w-14 h-14 rounded-2xl bg-emerald-50 dark:bg-emerald-950 text-emerald-600 dark:text-emerald-400 flex items-center justify-center mx-auto mb-3 text-2xl shadow-inner">
          <i class="fa-solid fa-shield-halved"></i>
        </div>
        <h1 class="text-2xl font-bold font-heading text-slate-900 dark:text-white">Create New Password</h1>
        <p class="text-xs text-slate-500 dark:text-slate-400 mt-1.5">
          Your new password must be at least 6 characters long.
        </p>
      </div>

      <!-- Password Reset Form -->
      <form id="reset-password-form" class="space-y-4">
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">
            Email Address
          </label>
          <input 
            type="email" 
            id="reset-email" 
            required 
            placeholder="Enter your registered email" 
            class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-xs text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500" 
          />
        </div>

        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">
            Security Verification Token
          </label>
          <input 
            type="text" 
            id="reset-token" 
            required 
            placeholder="Enter the token sent to your email" 
            class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-xs font-mono text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500" 
          />
        </div>

        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">
            New Secure Password
          </label>
          <div class="relative">
            <input 
              type="password" 
              id="new-password" 
              required 
              minlength="6" 
              placeholder="Enter your new password" 
              class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-xs text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500" 
            />
            <button type="button" onclick="togglePassword('new-password', this)" class="absolute right-3.5 top-3 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">
            Confirm New Password
          </label>
          <div class="relative">
            <input 
              type="password" 
              id="confirm-password" 
              required 
              minlength="6" 
              placeholder="Confirm your new password" 
              class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-xs text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500" 
            />
            <button type="button" onclick="togglePassword('confirm-password', this)" class="absolute right-3.5 top-3 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
        </div>

        <button 
          type="submit" 
          id="submit-btn" 
          class="w-full py-3.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs shadow-md shadow-emerald-600/25 transition flex items-center justify-center gap-2"
        >
          <span>Update Password</span>
          <i class="fa-solid fa-lock text-xs"></i>
        </button>
      </form>

      <!-- Success State -->
      <div id="success-box" class="hidden mt-6 p-5 rounded-2xl bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800/60 text-center">
        <div class="w-12 h-12 rounded-full bg-emerald-600 text-white flex items-center justify-center mx-auto mb-2 text-xl">
          <i class="fa-solid fa-check"></i>
        </div>
        <p class="text-sm font-bold text-emerald-900 dark:text-emerald-100">Password Changed Successfully!</p>
        <p class="text-xs text-emerald-700 dark:text-emerald-300 mt-1">You can now sign in with your updated credentials.</p>
        <div class="mt-4 flex gap-2 justify-center">
          <a href="student/login.html" class="px-4 py-2 rounded-xl bg-indigo-600 text-white text-xs font-bold hover:bg-indigo-700 transition">
            Student Login &rarr;
          </a>
          <a href="company/login.html" class="px-4 py-2 rounded-xl bg-slate-700 text-white text-xs font-bold hover:bg-slate-800 transition">
            Company Login &rarr;
          </a>
        </div>
      </div>
    </div>
  </main>

  <footer class="py-6 text-center text-xs text-slate-400 border-t border-slate-200 dark:border-slate-800">
    &copy; 2026 University Central Placement Cell • Secure Identity Gateway
  </footer>

  <script src="../js/main.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/ui.js"></script>
  <script>
    // Autofill from URL params
    const params = new URLSearchParams(window.location.search);
    if (params.get('token')) {
      document.getElementById('reset-token').value = params.get('token');
    }
    if (params.get('email')) {
      document.getElementById('reset-email').value = params.get('email');
    }

    function togglePassword(inputId, btn) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
        btn.innerHTML = '<i class="fa-regular fa-eye-slash"></i>';
      } else {
        input.type = 'password';
        btn.innerHTML = '<i class="fa-regular fa-eye"></i>';
      }
    }

    document.getElementById('reset-password-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const email = document.getElementById('reset-email').value.trim();
      const token = document.getElementById('reset-token').value.trim();
      const newPassword = document.getElementById('new-password').value;
      const confirmPassword = document.getElementById('confirm-password').value;
      const btn = document.getElementById('submit-btn');

      if (newPassword !== confirmPassword) {
        showToast('Passwords do not match! Please retype.', 'error');
        return;
      }
      if (newPassword.length < 6) {
        showToast('Password must be at least 6 characters long.', 'warning');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Resetting Password...';

      try {
        const res = await DB.resetPassword(token, email, newPassword);
        if (res.error) {
          showToast(res.error, 'error');
          btn.disabled = false;
          btn.innerHTML = '<span>Update Password</span> <i class="fa-solid fa-lock text-xs"></i>';
          return;
        }

        showToast('Password reset successfully!', 'success');
        document.getElementById('reset-password-form').classList.add('hidden');
        document.getElementById('success-box').classList.remove('hidden');
      } catch (err) {
        showToast('Network error while resetting password.', 'error');
        btn.disabled = false;
        btn.innerHTML = '<span>Update Password</span> <i class="fa-solid fa-lock text-xs"></i>';
      }
    });
  </script>
</body>
</html>
