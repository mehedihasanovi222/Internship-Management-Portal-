<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Internship Details - Internship Management Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50: '#eef2ff', 600: '#4f46e5', 700: '#4338ca' }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 flex h-screen overflow-hidden">

  <!-- Sidebar Component -->
  <aside id="student-sidebar-root"></aside>

  <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
    <!-- Topbar Component -->
    <header id="student-topbar-root"></header>

    <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8 space-y-6">
      
      <!-- Back Breadcrumbs -->
      <div class="flex items-center gap-2 text-xs font-semibold text-slate-500">
        <a href="internships.html" class="hover:text-indigo-600 transition flex items-center gap-1">
          <i class="fa-solid fa-arrow-left text-[10px]"></i> Back to Internships
        </a>
        <span>/</span>
        <span class="text-slate-800 dark:text-slate-200">Position Overview</span>
      </div>

      <!-- Detail Root View (Rendered by js/internships.js) -->
      <div id="internship-details-container">
        <!-- JS mounts full layout -->
      </div>

    </main>
  </div>

  <!-- Apply Modal Placeholder -->
  <div id="apply-internship-modal" class="fixed inset-0 z-50 hidden bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-3xl p-6 sm:p-8 max-w-lg w-full shadow-2xl space-y-4">
      <div class="flex items-center justify-between border-b border-slate-100 dark:border-slate-700 pb-3">
        <div>
          <h3 id="modal-job-title" class="font-bold text-base text-slate-900 dark:text-white">Apply for Position</h3>
          <p id="modal-company-name" class="text-xs text-slate-500">Company</p>
        </div>
        <button onclick="closeModal('apply-internship-modal')" class="p-2 text-slate-400 hover:text-slate-600 dark:hover:text-white">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <form id="apply-modal-form" class="space-y-4">
        <input type="hidden" id="modal-internship-id" />
        
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1">Attached PDF Resume</label>
          <div class="p-3 rounded-xl bg-slate-50 dark:bg-slate-700/40 border border-slate-200 dark:border-slate-600 flex items-center justify-between">
            <span class="text-xs font-bold text-slate-700 dark:text-slate-200 flex items-center gap-2">
              <i class="fa-solid fa-file-pdf text-rose-500"></i> Mehedi_Hasan_CSE_Resume_2026.pdf
            </span>
            <span class="text-[10px] font-bold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded">Verified</span>
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1">Cover Note / Statement of Interest *</label>
          <textarea id="modal-cover-letter" rows="4" required placeholder="Highlight your relevant course projects, technical skills, and availability..." class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-xs text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
        </div>

        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1">Portfolio or GitHub Project Link</label>
          <input type="url" id="modal-portfolio-link" placeholder="https://github.com/..." class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-xs text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>

        <div class="flex items-center justify-end gap-3 pt-2">
          <button type="button" onclick="closeModal('apply-internship-modal')" class="px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 text-xs font-bold text-slate-600 dark:text-slate-300">
            Cancel
          </button>
          <button type="submit" class="px-6 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold shadow-md">
            Submit Application
          </button>
        </div>
      </form>
    </div>
  </div>

  <script src="../../js/main.js"></script>
  <script src="../../js/ui.js"></script>
  <script src="../../js/internships.js"></script>
</body>
</html>
