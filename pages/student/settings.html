<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Settings - Internship Management Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50: '#eef2ff', 600: '#4f46e5', 700: '#4338ca' }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 flex h-screen overflow-hidden">

  <!-- Sidebar Component -->
  <aside id="student-sidebar-root"></aside>

  <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
    <!-- Topbar Component -->
    <header id="student-topbar-root"></header>

    <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8 space-y-6">
      
      <div>
        <h1 class="text-2xl font-bold font-heading text-slate-900 dark:text-white">Account & Portal Settings</h1>
        <p class="text-xs text-slate-500">Configure your notifications, appearance theme, and login credentials</p>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        
        <!-- Account Info Form -->
        <div class="p-6 sm:p-8 rounded-3xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 shadow-sm space-y-4">
          <h3 class="font-bold text-base text-slate-900 dark:text-white pb-2 border-b border-slate-100 dark:border-slate-700">
            Account Preferences
          </h3>

          <form id="student-settings-form" class="space-y-4">
            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">Display Name</label>
              <input type="text" id="settings-name" required class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-xs text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500" />
            </div>

            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">Contact Email</label>
              <input type="email" id="settings-email" required class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-xs text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500" />
            </div>

            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">Phone Number</label>
              <input type="tel" id="settings-phone" required class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-xs text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500" />
            </div>

            <div class="pt-2">
              <button type="submit" class="px-6 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs shadow-md transition">
                Save Account Settings
              </button>
            </div>
          </form>
        </div>

        <!-- Password Change Form -->
        <div class="p-6 sm:p-8 rounded-3xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 shadow-sm space-y-4">
          <h3 class="font-bold text-base text-slate-900 dark:text-white pb-2 border-b border-slate-100 dark:border-slate-700">
            Security & Password
          </h3>

          <form id="student-password-form" class="space-y-4">
            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">Current Password</label>
              <input type="password" required placeholder="••••••••" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-xs text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500" />
            </div>

            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">New Password</label>
              <input type="password" id="new-password" required placeholder="At least 6 characters" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-xs text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500" />
            </div>

            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">Confirm New Password</label>
              <input type="password" id="confirm-password" required placeholder="Repeat new password" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-xs text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500" />
            </div>

            <div class="pt-2">
              <button type="submit" class="px-6 py-2.5 rounded-xl bg-slate-800 dark:bg-slate-700 hover:bg-slate-900 text-white font-bold text-xs shadow-md transition">
                Update Password
              </button>
            </div>
          </form>
        </div>

        <!-- Notification Toggles -->
        <div class="p-6 sm:p-8 rounded-3xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 shadow-sm space-y-4 lg:col-span-2">
          <h3 class="font-bold text-base text-slate-900 dark:text-white pb-2 border-b border-slate-100 dark:border-slate-700">
            Notification Preferences
          </h3>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs">
            <label class="flex items-center justify-between p-3.5 rounded-2xl bg-slate-50 dark:bg-slate-700/40 border border-slate-100 dark:border-slate-700 cursor-pointer">
              <div>
                <p class="font-bold text-slate-800 dark:text-white">Email Notifications</p>
                <p class="text-slate-500 text-[11px]">Receive updates when companies shortlist your resume</p>
              </div>
              <input type="checkbox" checked class="rounded text-indigo-600 focus:ring-indigo-500" />
            </label>

            <label class="flex items-center justify-between p-3.5 rounded-2xl bg-slate-50 dark:bg-slate-700/40 border border-slate-100 dark:border-slate-700 cursor-pointer">
              <div>
                <p class="font-bold text-slate-800 dark:text-white">Interview Calendar Reminders</p>
                <p class="text-slate-500 text-[11px]">Get alerted 1 hour before scheduled technical interviews</p>
              </div>
              <input type="checkbox" checked class="rounded text-indigo-600 focus:ring-indigo-500" />
            </label>
          </div>
        </div>

      </div>

    </main>
  </div>

  <script src="../../js/main.js"></script>
  <script src="../../js/ui.js"></script>
  <script src="../../js/student.js"></script>
</body>
</html>
