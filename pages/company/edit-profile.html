<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Company Profile - Internship Management Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50: '#eef2ff', 600: '#4f46e5', 700: '#4338ca' }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../css/style.css">
  <script src="../../js/auth-guard.js"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 flex h-screen overflow-hidden">

  <!-- Company Sidebar Component -->
  <aside id="company-sidebar-root"></aside>

  <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
    <!-- Company Topbar Component -->
    <header id="company-topbar-root"></header>

    <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8 space-y-6">
      
      <div class="flex items-center justify-between">
        <div>
          <h1 class="text-2xl font-bold font-heading text-slate-900 dark:text-white">Edit Company Profile</h1>
          <p class="text-xs text-slate-500">Update your company details, logo, and recruiter contacts</p>
        </div>
        <a href="profile.html" class="px-4 py-2 rounded-xl border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 text-xs font-semibold hover:bg-slate-100 dark:hover:bg-slate-800 transition">
          Cancel
        </a>
      </div>

      <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-3xl p-6 sm:p-8 shadow-sm">
        <form id="edit-company-form" class="space-y-6">
          
          <!-- Company Brand Logo Widget -->
          <div class="p-5 rounded-2xl bg-cyan-50/50 dark:bg-cyan-950/30 border border-cyan-100 dark:border-cyan-900/40">
            <h3 class="text-xs font-bold uppercase tracking-wider text-cyan-700 dark:text-cyan-300 mb-3 flex items-center gap-2">
              <i class="fa-solid fa-building"></i> Organization Brand Logo (Max 5MB)
            </h3>
            <div class="flex flex-col sm:flex-row items-center gap-5">
              <div class="relative w-20 h-20 rounded-2xl overflow-hidden border-2 border-cyan-500 shadow-md shrink-0 bg-white p-1">
                <img id="edit-logo-preview" src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=100&auto=format&fit=crop&q=80" alt="Logo Preview" class="w-full h-full object-contain rounded-xl" />
              </div>
              <div class="flex-1 text-center sm:text-left text-xs space-y-2">
                <p class="font-bold text-slate-800 dark:text-white">Corporate Brand Mark</p>
                <p class="text-slate-500 dark:text-slate-400 text-[11px]">PNG, JPG, or WebP. Displayed on public internship openings and offer letters.</p>
                <div class="flex flex-wrap items-center justify-center sm:justify-start gap-2 pt-1">
                  <label class="px-3.5 py-2 rounded-xl bg-cyan-600 text-white font-bold text-xs cursor-pointer hover:bg-cyan-700 shadow-sm transition inline-flex items-center gap-1.5">
                    <i class="fa-solid fa-cloud-arrow-up"></i> Upload Brand Logo
                    <input type="file" id="edit-logo-file-input" accept="image/png,image/jpeg,image/webp" class="hidden" onchange="handleCompanyLogoFile(this)" />
                  </label>
                  <button type="button" onclick="handleCompanyLogoRemove()" class="px-3 py-2 rounded-xl border border-rose-200 dark:border-rose-900/60 text-rose-600 dark:text-rose-400 text-xs font-bold hover:bg-rose-50 dark:hover:bg-rose-950/40 transition flex items-center gap-1.5">
                    <i class="fa-regular fa-trash-can"></i> Reset to Default
                  </button>
                  <span id="logo-upload-status" class="text-[11px] font-semibold text-cyan-600 dark:text-cyan-400 hidden"></span>
                </div>
              </div>
            </div>
            <input type="hidden" id="edit-logo-url" />
          </div>

          <div>
            <h3 class="text-sm font-bold uppercase tracking-wider text-cyan-600 dark:text-cyan-400 mb-4 pb-2 border-b border-slate-100 dark:border-slate-700">
              Company Overview
            </h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">Company Name *</label>
                <input type="text" id="edit-cname" required class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-xs text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-cyan-500" />
              </div>
              <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">Tagline / Motto</label>
                <input type="text" id="edit-tagline" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-xs text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-cyan-500" />
              </div>
              <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">Industry *</label>
                <input type="text" id="edit-industry" required class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-xs text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-cyan-500" />
              </div>
              <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">Company Size</label>
                <input type="text" id="edit-size" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-xs text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-cyan-500" />
              </div>
              <div class="sm:col-span-2">
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">Website URL *</label>
                <input type="url" id="edit-website" required class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-xs text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-cyan-500" />
              </div>
            </div>
          </div>

          <div>
            <h3 class="text-sm font-bold uppercase tracking-wider text-indigo-600 dark:text-indigo-400 mb-4 pb-2 border-b border-slate-100 dark:border-slate-700">
              Location & HR Contact
            </h3>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
              <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">Location *</label>
                <input type="text" id="edit-location" required class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-xs text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500" />
              </div>
              <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">General Email *</label>
                <input type="email" id="edit-email" required class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-xs text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500" />
              </div>
              <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">Phone *</label>
                <input type="tel" id="edit-phone" required class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-xs text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500" />
              </div>
              <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">HR Lead Name *</label>
                <input type="text" id="edit-hr-name" required class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-xs text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500" />
              </div>
              <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">HR Direct Email *</label>
                <input type="email" id="edit-hr-email" required class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-xs text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500" />
              </div>
              <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">HR Phone</label>
                <input type="tel" id="edit-hr-phone" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-xs text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500" />
              </div>
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">Company Description *</label>
            <textarea id="edit-desc" rows="4" required class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-xs text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
          </div>

          <div class="pt-4 flex items-center justify-end gap-3 border-t border-slate-100 dark:border-slate-700">
            <a href="profile.html" class="px-5 py-3 rounded-xl border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 text-xs font-bold hover:bg-slate-100 dark:hover:bg-slate-800 transition">
              Cancel
            </a>
            <button type="submit" class="px-7 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold shadow-md shadow-indigo-600/25 transition">
              Save Company Profile
            </button>
          </div>

        </form>
      </div>

    </main>
  </div>

  <script src="../../js/main.js"></script>
  <script src="../../js/ui.js"></script>
  <script src="../../js/company.js"></script>
</body>
</html>
