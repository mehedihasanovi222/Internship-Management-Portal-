<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Company Interview Management - Internship Management Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50: '#eef2ff', 600: '#4f46e5', 700: '#4338ca' }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 flex h-screen overflow-hidden">

  <!-- Company Sidebar Component -->
  <aside id="company-sidebar-root"></aside>

  <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
    <!-- Company Topbar Component -->
    <header id="company-topbar-root"></header>

    <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8 space-y-6">
      
      <!-- Page Header -->
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div>
          <h1 class="text-2xl font-bold font-heading text-slate-900 dark:text-white">Interview Schedules & Rounds</h1>
          <p class="text-xs text-slate-500">Conduct technical evaluations, record interview notes, and score candidates</p>
        </div>
      </div>

      <!-- Filter Tabs -->
      <div class="flex items-center gap-2 text-xs font-bold">
        <button class="company-interview-tab px-4 py-2 rounded-xl bg-indigo-600 text-white transition shadow-sm" data-status="Upcoming">
          Upcoming Rounds
        </button>
        <button class="company-interview-tab px-4 py-2 rounded-xl bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700 transition" data-status="Completed">
          Completed
        </button>
        <button class="company-interview-tab px-4 py-2 rounded-xl bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700 transition" data-status="All">
          All
        </button>
      </div>

      <!-- Interviews List Container -->
      <div id="company-interviews-container" class="space-y-4">
        <!-- Rendered by js/interviews.js -->
      </div>

    </main>
  </div>

  <script src="../../js/main.js"></script>
  <script src="../../js/ui.js"></script>
  <script src="../../js/interviews.js"></script>
</body>
</html>
