<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Applicants - Internship Management Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50: '#eef2ff', 600: '#4f46e5', 700: '#4338ca' }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 flex h-screen overflow-hidden">

  <!-- Company Sidebar Component -->
  <aside id="company-sidebar-root"></aside>

  <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
    <!-- Company Topbar Component -->
    <header id="company-topbar-root"></header>

    <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8 space-y-6">
      
      <!-- Page Header -->
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div>
          <h1 class="text-2xl font-bold font-heading text-slate-900 dark:text-white">Student Candidates & Applicants</h1>
          <p class="text-xs text-slate-500">Screen resumes, update recruitment stages, and schedule technical rounds</p>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="showToast('Exported candidate ATS roster to CSV file!', 'success')" class="px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 font-bold text-xs transition flex items-center gap-1.5">
            <i class="fa-solid fa-file-export text-emerald-500"></i> Export CSV
          </button>
        </div>
      </div>

      <!-- Search & Filters Container -->
      <div class="p-6 rounded-3xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 shadow-sm space-y-4">
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
          <!-- Keyword -->
          <div class="relative">
            <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-xs text-slate-400"></i>
            <input type="text" id="applicant-search" placeholder="Search by student name, ID, skills..." class="w-full pl-9 pr-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-xs text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500" />
          </div>

          <!-- Filter Job Post -->
          <div>
            <select id="applicant-job-filter" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-xs text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
              <option value="">All Job Postings</option>
              <!-- Dynamically options -->
            </select>
          </div>

          <!-- Filter Stage / Status -->
          <div>
            <select id="applicant-status-filter" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-xs text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
              <option value="">All Screening Stages</option>
              <option value="Applied">Applied</option>
              <option value="Reviewed">Reviewed</option>
              <option value="Shortlisted">Shortlisted</option>
              <option value="Interview">Interview Scheduled</option>
              <option value="Selected">Selected / Offered</option>
              <option value="Rejected">Rejected</option>
            </select>
          </div>

          <!-- Sort -->
          <div>
            <select id="applicant-sort-filter" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-xs text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
              <option value="latest">Sort: Applied Date</option>
              <option value="cgpa">Highest CGPA</option>
              <option value="name">Alphabetical (A-Z)</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Applicants List Table / Cards Root -->
      <div id="company-applicants-container">
        <!-- Rendered dynamically by js/company.js -->
      </div>

    </main>
  </div>

  <script src="../../js/main.js"></script>
  <script src="../../js/ui.js"></script>
  <script src="../../js/company.js"></script>
</body>
</html>
